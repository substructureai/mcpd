name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only, do not publish'
        type: boolean
        default: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            host: macos-15
            platform: darwin-arm64
          - target: x86_64-apple-darwin
            host: macos-15
            platform: darwin-x64
          # musl: mcpd runs inside sandboxes, so the binary has to be static
          # and land in images that have no glibc.
          - target: x86_64-unknown-linux-musl
            host: ubuntu-24.04
            platform: linux-x64
          - target: aarch64-unknown-linux-musl
            host: ubuntu-24.04-arm
            platform: linux-arm64

    runs-on: ${{ matrix.host }}

    steps:
      - uses: actions/checkout@v6

      - name: Check tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          [ "$TAG" = "$CRATE" ] || { echo "tag $TAG != Cargo.toml $CRATE"; exit 1; }

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --bin mcpd --target ${{ matrix.target }}

      # Asset names carry no version, so `releases/latest/download/<name>`
      # resolves without an API call. Pinning goes through the tag instead.
      - name: Package release tarball
        shell: bash
        run: |
          NAME="mcpd-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf "dist/$NAME" mcpd
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$NAME" > "$NAME.sha256"
          else
            shasum -a 256 "$NAME" > "$NAME.sha256"
          fi

      - name: Upload release tarball
        uses: actions/upload-artifact@v7
        with:
          name: tarball-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download release tarballs
        uses: actions/download-artifact@v8
        with:
          pattern: tarball-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" --verify-tag --generate-notes
