[package]
name = "mcpd"
version = "0.2.1"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
clap = { version = "4.6.6", features = ["derive"] }
jsonschema = { version = "0.49.9", default-features = false }
libc = "0.2.189"
rmcp = { version = "3.1.3", default-features = false, features = ["server", "transport-io", "transport-streamable-http-server"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2.0.20"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal", "process", "io-util", "time", "rt"] }
tokio-util = "0.7.19"
toml = "1.1.4"
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
reqwest = { version = "0.13.4", default-features = false, features = ["json"] }
tempfile = "3.27.0"
